  - id: CONSENT-001
    title: A user answers the analytics consent and can change it
    journey: analytics consent
    priority: P0
    roles: [mentee]
    why: >-
      The answer is stored per user and replaced by a later one; /me shows it,
      null until answered (decision 329).
    smoke_prod: false
    steps:
      - {kind: api, id: unanswered, viewer: mentee_with_credits, method: GET, path: /api/v1/me,
         expect: {status: 200, json: {/analytics_consent: null}}, human: "Nothing answered yet."}
      - {kind: api, id: bad, viewer: mentee_with_credits, method: PUT, path: /api/v1/me/consents/analytics,
         body: {granted: true}, expect: {status: 422}, human: "An answer needs the consent version."}
      - {kind: api, id: grant, viewer: mentee_with_credits, method: PUT, path: /api/v1/me/consents/analytics,
         body: {granted: true, version: "2026-11"},
         expect: {status: 200, json: {/granted: true, /version: "2026-11", /answered_at: "<present>"}},
         human: "Accept analytics."}
      - {kind: api, id: withdraw, viewer: mentee_with_credits, method: PUT, path: /api/v1/me/consents/analytics,
         body: {granted: false, version: "2026-11"}, expect: {status: 200, json: {/granted: false}},
         human: "Withdraw it."}
      - {kind: api, id: shown, viewer: mentee_with_credits, method: GET, path: /api/v1/me,
         expect: {status: 200, json: {/analytics_consent/granted: false}}, human: "The latest answer is shown."}
    assertions:
      - {id: one_row, check: db, after: withdraw,
         query: "SELECT count(*) AS n FROM analytics_consents WHERE user_id = :u",
         binds: {u: "${mentee_with_credits.id}"}, expect: {first: {n: 1}}, human: "One answer per person, replaced."}

  - id: ACQ-001
    title: How someone found us is recorded once
    journey: acquisition
    priority: P0
    roles: [mentee]
    why: >-
      The first answer is stored and later ones change nothing; unknown values
      become direct / other rather than being refused (decision 329).
    smoke_prod: false
    preconditions: ["mentee_late_cancel has never opened the app: the app records acquisition at a first sign-in (AUTH-001 does that for mentee_new)"]
    steps:
      - {kind: api, id: first, viewer: mentee_late_cancel, method: POST, path: /api/v1/me/acquisition,
         body: {source: not-a-source, channel: not-a-channel},
         expect: {status: 201, json: {/source: direct, /channel: other}}, human: "The first answer is stored."}
      - {kind: api, id: second, viewer: mentee_late_cancel, method: POST, path: /api/v1/me/acquisition,
         body: {source: invite, channel: whatsapp},
         expect: {status: 200, json: {/source: direct, /channel: other}}, human: "A later answer changes nothing."}
    assertions:
      - {id: stored, check: db, after: second,
         query: "SELECT signup_source, signup_channel, acquired_at IS NOT NULL AS acquired FROM users WHERE id = :u",
         binds: {u: "${mentee_late_cancel.id}"}, expect: {first: {signup_source: direct, signup_channel: other, acquired: true}},
         human: "The first answer is what is kept."}
      - {id: app_recorded, check: db, after: second,
         query: "SELECT acquired_at IS NOT NULL AS acquired FROM users WHERE id = :u",
         binds: {u: "${mentee_new.id}"}, expect: {first: {acquired: true}},
         human: "The app itself recorded how mentee_new arrived, at their first sign-in."}

