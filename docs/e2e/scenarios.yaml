         human: "The mentee sends a message."}
      - {kind: api, id: resend, viewer: mentee_with_credits, method: POST, path: "/api/v1/me/messages/{user_id}",
         params: {user_id: "${mentor_listed.id}"}, body: {client_id: "<same as send>", body: Hello from E2E},
         expect: {status: 200, json: {/id: "${message_id}"}}, human: "A retry does not send it twice."}
      - {kind: api, id: unread, viewer: mentor_listed, method: GET, path: /api/v1/me/messages/unread,
         expect: {status: 200, json: {/total: "<int>"}}, human: "The mentor has an unread message."}
      - {kind: api, id: thread, viewer: mentor_listed, method: GET, path: "/api/v1/me/messages/{user_id}",
         params: {user_id: "${mentee_with_credits.id}"}, expect: {status: 200, json: {/items: "<nonempty>"}},
         human: "The mentor reads it."}
