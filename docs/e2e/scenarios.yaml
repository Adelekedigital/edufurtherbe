    title: A booked pair can message each other, and strangers cannot
    journey: messages
    priority: P0
    roles: [mentee, mentor]
    why: >-
      Two people may message once they share a booked session (confirmed,
      completed, no-show or cancelled); anyone else is refused (decision 301).
    smoke_prod: false
    preconditions: ["BOOK-001 passed"]
    steps:
      - {kind: api, id: stranger, viewer: mentee_new, method: POST, path: "/api/v1/me/messages/{user_id}",
         params: {user_id: "${mentor_listed.id}"}, body: {client_id: "<new>", body: Hello},
         expect: {status: 403, json: {/type: /problems/not-connected}}, human: "Someone with no booking cannot message."}
