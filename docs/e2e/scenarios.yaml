         params: {user_id: "${mentee_with_credits.id}"}, body: {client_id: "<new>", body: Reply from E2E},
         expect: {status: 201}, human: "The mentor replies."}

  # ------------------------------------------------------------------ account
  - id: ACCT-001
    title: A mentee deletes their account; it can be restored for 30 days, then is purged
    journey: account deletion and purge
    priority: P0
    roles: [mentee, admin]
    why: >-
      Deleting needs the word DELETE, signs out everywhere and schedules a purge
      30 days later (decision 277); a super admin may restore before then.
    smoke_prod: false
    preconditions: ["mentee_to_delete is seeded and has signed in once"]
    steps:
      - {kind: api, id: me, viewer: mentee_to_delete, method: GET, path: /api/v1/me,
         expect: {status: 200}, human: "The account exists."}
      - {kind: api, id: no_confirm, viewer: mentee_to_delete, method: DELETE, path: /api/v1/me,
         body: {confirm: delete}, expect: {status: 422}, human: "Deleting without typing DELETE is refused."}
      - kind: ui
        id: delete_ui
        viewer: mentee_to_delete
        viewport: [390, 1440]
        route: /settings/security
        actions:
          - {do: click, target: {role: button, name: Delete account}}
          - {do: wait, target: {role: alertdialog, name: "Delete your account?"}}
          - {do: fill, target: {label: Type DELETE to confirm}, value: DELETE}
        expect:
          - {visible: {role: button, name: Delete my account}}
        screenshot: true
        a11y: true
        human: "Open Settings, Login & security, choose Delete account and type DELETE. The API step deletes it."
      - {kind: api, id: delete, viewer: mentee_to_delete, method: DELETE, path: /api/v1/me,
         body: {confirm: DELETE}, expect: {status: 204}, human: "Delete the account."}
      - {kind: api, id: gone, viewer: mentee_to_delete, method: GET, path: /api/v1/me,
         expect: {status: 404}, human: "The account is gone for that sign-in."}
      - {kind: job, id: purge_dry_run, script: scripts/purge_deleted_users.py, args: [--dry-run], expect: {exit: 0},
         human: "A purge dry run does not count this account yet: it is not due for 30 days."}
      - {kind: api, id: viewer_cannot_restore, viewer: admin_viewer, method: POST,
         path: "/api/v1/admin/users/{user_id}/restore", params: {user_id: "${mentee_to_delete.id}"},
         expect: {status: 404}, human: "A limited admin cannot restore."}
      - {kind: api, id: restore, viewer: admin_super, method: POST, path: "/api/v1/admin/users/{user_id}/restore",
         params: {user_id: "${mentee_to_delete.id}"}, expect: {status: 204}, human: "A super admin restores it."}
    assertions:
      - {id: scheduled, check: db, after: delete,
         query: "SELECT (deletion_purge_at - deleted_at) = interval '30 days' AS thirty FROM users WHERE id = :u",
         binds: {u: "${mentee_to_delete.id}"}, expect: {first: {thirty: true}}, human: "The purge is due in 30 days."}
      - {id: restored, check: db, after: restore,
         query: "SELECT deleted_at IS NULL AS live FROM users WHERE id = :u",
         binds: {u: "${mentee_to_delete.id}"}, expect: {first: {live: true}}, human: "The account is live again."}
    cleanup: ["None. The purge itself is covered by its integration tests and the daily job's logs (founder, 2026-11-10)."]

  # ------------------------------------------------------------------ preview
  - id: PREVIEW-001
    title: An admin previews the app as a mentee, read only
    journey: preview as user
    priority: P0
    roles: [admin, mentee]
    why: >-
      With X-EF-Preview an admin's request is answered as the user, and any
      write is refused with 403 read-only-view-as (decisions 309, 313); messages
      stay hidden until revealed (decision 314).
    smoke_prod: false
    flags: [PREVIEW_AS_USER_ENABLED]
    preconditions: ["MSG-001 passed (mentee_with_credits has messages)"]
    steps:
      - {kind: api, id: can_preview, viewer: admin_viewer, method: GET, path: /api/v1/me,
         expect: {status: 200, json: {/can_preview_as_user: true}}, human: "The admin may preview."}
      - {kind: api, id: start, viewer: admin_viewer, method: POST, path: /api/v1/admin/preview-sessions,
         body: {user_id: "${mentee_with_credits.id}"},
         expect: {status: 201, json: {/id: "<uuid>", /user/role: mentee, /revealed: false}}, save: {preview_id: /id},
         human: "Start a preview as the mentee."}
      - {kind: api, id: read_as, viewer: admin_viewer, method: GET, path: /api/v1/me,
         headers: {X-EF-Preview: "${preview_id}"}, expect: {status: 200, json: {/id: "${mentee_with_credits.id}"}},
         human: "The app shows the mentee's account."}
      - {kind: api, id: write_refused, viewer: admin_viewer, method: PUT, path: /api/v1/me/consents/analytics,
         headers: {X-EF-Preview: "${preview_id}"}, body: {granted: true, version: e2e},
         expect: {status: 403, json: {/type: /problems/read-only-view-as, /code: read_only_view_as}},
         human: "Changing anything is refused."}
      - {kind: api, id: hidden, viewer: admin_viewer, method: GET, path: "/api/v1/me/messages/{user_id}",
         params: {user_id: "${mentor_listed.id}"}, headers: {X-EF-Preview: "${preview_id}"},
         expect: {status: 200, json: {/items/0/hidden_in_preview: true}}, human: "Message contents are hidden."}
      - kind: ui
        id: banner_ui
        viewer: admin_viewer
        viewport: [1440]
        route: /admin/mentors
        actions:
          - {do: click, target: {role: button, name: Preview as user}}
          - {do: wait, target: {role: dialog, name: Choose a user to preview as}}
          - {do: fill, target: {role: combobox, name: Search users by email or name}, value: "${mentee_with_credits.email}"}
          - {do: click, target: {role: option, name: "/${mentee_with_credits.email}/"}}
        expect:
          - {visible: {role: region, name: Preview as user}}
          - {visible: {role: button, name: "Previewing as ${mentee_with_credits.email}. Switch user"}}
          - {visible: {role: button, name: Exit preview}}
        screenshot: true
        a11y: true
        human: "The admin chooses Preview as user and picks the mentee. The banner names whose view this is and offers Exit preview."
      - {kind: api, id: end, viewer: admin_viewer, method: POST, path: "/api/v1/admin/preview-sessions/{preview_id}/end",
         params: {preview_id: "${preview_id}"}, body: {reason: exit}, expect: {status: 204}, human: "End the preview."}
      - {kind: api, id: ended, viewer: admin_viewer, method: GET, path: /api/v1/me,
         headers: {X-EF-Preview: "${preview_id}"}, expect: {status: 401, json: {/type: /problems/preview-ended}},
         human: "The ended preview no longer works."}
    assertions:
      - {id: blocked_logged, check: db, after: write_refused,
         query: "SELECT count(*) AS n FROM preview_events WHERE session_id = :p AND kind = 'blocked_write'",
         binds: {p: "${preview_id}"}, expect: {first: {n: 1}}, human: "The refused write was logged."}
      - {id: consent_unchanged, check: api, after: write_refused, viewer: mentee_with_credits, method: GET,
         path: /api/v1/me, expect: {status: 200, json: {/analytics_consent: null}}, human: "The mentee's data did not change."}

