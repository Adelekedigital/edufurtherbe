name: Expire credits (manual recovery)

# QStash owns runtime cadence. This dispatch exists only for recovery.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  expire:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Expire credit lots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/expire_credits.py
