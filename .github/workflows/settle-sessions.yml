name: Settle sessions (manual recovery)

# QStash owns runtime cadence. This dispatch invokes the same RuntimeJobs
# surface only for exceptional operator recovery.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  settle:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Settle sessions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/settle_sessions.py
