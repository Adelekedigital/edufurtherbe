name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Verify the tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$project" ]; then
            echo "Tag v$tag does not match pyproject version $project" >&2
            exit 1
          fi

      - name: Run the full gate before publishing
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run python scripts/check_layers.py
          uv run pytest --cov=src/app --cov-branch --cov-fail-under=85
          uv run bandit -q -ll -r src

      - name: Build distribution
        run: uv build

      - name: Extract this version's changelog section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; next }
            capture && /^## \[/     { exit }
            capture                 { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section found for $version" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
