name: Monthly credits (manual recovery)

# QStash owns runtime cadence. The database uniqueness constraint still makes
# this manual recovery safe to retry within a grant period.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment's database to run against
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  grant:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: monthly-credits-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Grant monthly credits
        env:
          EDUFURTHER_ENVIRONMENT: ${{ inputs.environment }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/grant_monthly_credits.py
