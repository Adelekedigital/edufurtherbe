name: Publish API spec

# The frontend's CI downloads the spec from a fixed URL and generates its client
# from it, so a hand-copied spec never goes stale:
#   https://github.com/Adelekedigital/edufurtherbe/releases/download/openapi-latest/openapi.json
#
# **A rolling pre-release, never "latest".** One release, tag `openapi-latest`,
# whose single asset is replaced on every push to `main`. Marked pre-release and
# `--latest=false` so it never shadows a real release in the repository's UI or
# in "latest release" API lookups.
#
# **Public because the repository is.** The spec says nothing the code and the
# running API's own `/openapi.json` do not already. If the repository goes
# private, the asset does too; the frontend's CI then needs a read-only token
# for the download, and nothing here changes.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Write access for the release, and nothing else.
permissions:
  contents: write

# One run at a time, and **never cancelled mid-run**. `upload --clobber` deletes
# the old asset before uploading the new one, so a run cancelled between the two
# would leave the fixed URL a 404 until the next push. GitHub still keeps only
# the newest *pending* run, so the newest spec wins without cancelling anything.
concurrency:
  group: publish-openapi
  cancel-in-progress: false

env:
  UV_FROZEN: "1"
  RELEASE_TAG: openapi-latest

jobs:
  publish:
    name: Export and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # The same command a person runs locally; see the script's docstring.
      - name: Export the spec
        run: uv run python scripts/export_openapi.py --out openapi.json

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="The API spec as of ${GITHUB_SHA}. Replaced on every push to main."
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "API spec (rolling)" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false
          else
            gh release edit "$RELEASE_TAG" --notes "$notes"
          fi
          gh release upload "$RELEASE_TAG" openapi.json --clobber
