name: CI

on:
  push:
    branches: [main]
  pull_request:
  # **Manual, and it earned its place.** When Actions had no runners for three
  # days, `main` could not be re-verified without pushing a commit to it — the
  # one branch where an empty commit is the worst way to ask a question. Nine
  # PRs merged unverified in that window and the only route back was re-running
  # a historical run by id.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, types, layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Selected from scripts/check.py rather than restated here, so the command
      # strings exist in one place and CI cannot drift from the local gate.
      - name: Format, lint, types, layers
        run: uv run python scripts/check.py --only format,lint,types,layers

  # No interpreter matrix. A matrix earns its keep for a library consumed on many
  # Python versions; this is an application deployed on exactly one, pinned by
  # .python-version. A second job would double the minutes to test a
  # configuration that never runs anywhere.
  test:
    name: Tests
    runs-on: ubuntu-latest

    # A service container rather than testcontainers. The library would pull the
    # Docker SDK and its requests/urllib3 chain into `uv export`, which feeds
    # `pip-audit --strict` on a weekly schedule — a standing CVE surface for a
    # package whose only job is starting the container this block starts for
    # free. Version 17 matches docker-compose.yml; change both together.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: edufurther
          POSTGRES_PASSWORD: edufurther
          POSTGRES_DB: edufurther
        ports:
          - 5432:5432
        # Without a health check the first test races the database's startup and
        # fails on connection refused, intermittently and only on busy runners.
        options: >-
          --health-cmd "pg_isready -U edufurther -d edufurther"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # PYTEST_ADDOPTS carries the reporting flags that only CI needs, so the
      # coverage thresholds themselves stay defined in scripts/check.py.
      - name: Run tests with coverage
        env:
          PYTEST_ADDOPTS: --cov-report=xml --junitxml=junit.xml
          TEST_DATABASE_URL: postgresql://edufurther:edufurther@localhost:5432/edufurther
          # Turns "no database, so skip" into "no database, so fail". Locally a
          # skip is the right answer — not every machine runs Docker. Here it is
          # not: a skipped test and a passing test render identically in a
          # summary, so without this the entire database tier could vanish and
          # the check would still be green.
          REQUIRE_DB_TESTS: "1"
        run: uv run python scripts/check.py --only tests

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
