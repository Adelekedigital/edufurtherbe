name: Sync institutions (manual recovery)

# QStash owns runtime cadence. This dispatch uses the shared job runner for
# exceptional recovery; it is not the runtime scheduler.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment's database to run against
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: sync-institutions-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Validate catalogue shape
        run: uv run python scripts/sync_institutions.py --dry-run
      - name: Mirror and link
        env:
          EDUFURTHER_ENVIRONMENT: ${{ inputs.environment }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python scripts/sync_institutions.py || status=$?
          status=${status:-0}
          if [ "$status" -eq 2 ]; then
            echo "::warning::mirrored, but some school names need review"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
