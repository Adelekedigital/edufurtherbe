name: Credit reminders (manual recovery)

# QStash owns runtime cadence. This remains an exceptional recovery path.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Queue reminders
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/remind_expiring_credits.py
