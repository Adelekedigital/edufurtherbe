[project]
name = "edufurtherbe"
version = "0.1.0"
description = "Backend API for EduFurther â€” mentorship platform connecting African students with graduate school mentors."
readme = "README.md"
# One version, tested, claimed. A wider floor than CI actually exercises is an
# unverified compatibility promise; this is a deployed application, not a library
# consumed on many interpreters, so there is nothing to gain by making one.
requires-python = ">=3.14"
dependencies = [
    # Bare, not `[standard]` (#19): that extra added the `fastapi` CLI, the
    # FastAPI Cloud CLI and their tooling, none of which the running app imports.
    # Railway starts it with `uvicorn`, never `fastapi run`. What the app does
    # use is declared below with its reason, each floor the version locked when
    # it was declared; tests/unit/test_runtime_dependencies.py fails on an
    # import from `src/` that no line here declares, and pins the few needed
    # without one (`NEEDED_WITHOUT_AN_IMPORT`).
    "fastapi>=0.141.1",
    # Imported directly by the middleware and request-id code, not only via FastAPI.
    "starlette>=1.3.1",
    # The server Railway's start command runs.
    "uvicorn[standard]>=0.32.0",
    # Every outbound client in infra/.
    "httpx>=0.28.1",
    # FastAPI needs it to parse `UploadFile` forms (intake files, profile photos).
    "python-multipart>=0.0.32",
    # Pydantic needs it for `EmailStr` (a referral's invitee address).
    "email-validator>=2.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    # Error reporting (ADR 0030), started in infra/observability.py.
    "sentry-sdk>=2.66.0",
    # Persistence. The `asyncio` extra pulls greenlet, which SQLAlchemy's async
    # layer requires rather than merely benefits from.
    "sqlalchemy[asyncio]>=2.0.36",
    # The driver the database URL selects; never imported by name.
    # 0.31 is the first release with a cp314 wheel. A lower floor resolves and
    # then tries to build from source on a machine with no C compiler, which is
    # every Windows dev box here.
    "asyncpg>=0.31",
    # The IANA time-zone database, as a package rather than a system dependency.
    #
    # `zoneinfo` has no bundled data: it reads the operating system's database,
    # and Windows has none. `available_timezones()` returns **zero** on a Windows
    # dev machine without this, so every `ZoneInfo("Africa/Lagos")` raises â€” while
    # CI on ubuntu passes, because Linux ships the database. A slim container
    # image usually does not.
    #
    # That matters here beyond convenience: `users.timezone` stores IANA names, a
    # guardrail requires the mentor's zone as its own column, and M3 availability
    # is entirely time-zone conversion. Pinning the data as a dependency makes the
    # three environments agree instead of differing by platform.
    "tzdata>=2025.1",
    "pyjwt>=2.14.0",
    "cryptography>=50.0.0",
    # Decoding, downscaling and re-encoding uploaded images. **The only
    # dependency here that decodes an untrusted *file format*** â€” not the only
    # one reached by hostile bytes, which would be false: httptools parses every
    # HTTP request in C and pydantic-core parses every JSON body in Rust. The
    # distinction is in `domain/images.py`, and it is why that module caps the
    # decoded pixel count before any bitmap is allocated.
    #
    # Re-encoding is also what strips EXIF â€” the GPS coordinates a phone puts in
    # a photo â€” which ADR 0019 left open and which had to be settled before
    # profiles became public.
    # The floor is the version this was verified against, not the oldest that
    # might work. The migration decodes AVIF, which needs a build carrying the
    # codec â€” `features.check_module("avif")` was confirmed true here â€” and a
    # floor guessed from a changelog is a claim nobody checked.
    "pillow>=13.0",
    "opencv-python-headless>=5,<6",
    "numpy>=2.5,<3",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    # Pinned exactly, and kept equal to the `rev:` values in
    # .pre-commit-config.yaml. These three decide whether code passes, and their
    # verdicts change between versions â€” a floor range lets the venv drift away
    # from the hooks, so pre-commit and CI start disagreeing about identical
    # code. After `pre-commit autoupdate`, update these to match.
    "ruff==0.16.1",
    "mypy==2.3.0",
    "bandit[toml]==1.9.4",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-randomly>=3.16.0",
    # 1.x, not 0.x: the configuration keys below are the 1.0 spelling, and 0.x
    # silently ignores them.
    #
    # No testcontainers. It pulls the Docker SDK and its requests/urllib3 chain
    # into `uv export`, which feeds `pip-audit --strict` on a weekly schedule â€”
    # a standing CVE surface for a package whose only job is starting a
    # container. A DATABASE URL from docker-compose locally and a `services:`
    # block in CI give the same real-Postgres guarantee with no dependency.
    "pytest-asyncio>=1.0",
    # Generator-only, and deliberately not a runtime dependency. Reference rows
    # are baked into a migration by scripts/generate_reference_seeds.py, so the
    # application never needs this at import or request time â€” shipping it would
    # be dead weight in the image and another entry in the weekly pip-audit.
    "pycountry>=24.6.1",
    # Dev-only: migrations run from the Migrate workflow and dev machines, never
    # inside the running app, and Railway has no pre-deploy command (#19).
    "alembic>=1.14",
    "pip-audit>=2.7.0",
    "pre-commit>=4.6.1",
    "pytest-xdist>=3.8.0",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.uv]
# Floors for transitive dependencies with published vulnerabilities, so a
# re-lock can never resolve back to them. urllib3 arrives through requests and
# sentry-sdk (runtime); 2.8.0 fixes CVE-2026-97687, -97688 and -97689.
constraint-dependencies = ["urllib3>=2.8.0", "virtualenv>=21.7.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
# 100, not the default 88, so scripts/check_layers.py stays byte-identical to the
# shared package copy. It is documented as drop-in reusable; reformatting it here
# would create a diff against every future update.
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# Matches the `exclude: ^\.claude/` on the ruff hooks in .pre-commit-config.yaml.
# Without it, CI's bare `ruff check .` would lint files pre-commit skips, and the
# local gate would disagree with the remote one.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "N",    # naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtin shadowing
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "S",    # bandit overlap â€” catches issues before commit
    "ARG",  # unused arguments
    "PTH",  # pathlib over os.path
    "TID",  # tidy imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so `from scripts import ...` resolves.
#
# It resolved before only as a side effect: `alembic.ini` sets
# `prepend_sys_path = .`, so any test that ran a migration first left the root on
# sys.path for whatever came after. Tests importing `scripts` therefore passed in
# a full run and failed in isolation â€” order dependence that `-p no:randomly`
# hides and a single-test invocation exposes. `scripts/` stays a non-package on
# purpose; this makes the path explicit instead of inherited.
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
# Unexpected warnings fail the suite instead of accumulating into an unreadable
# flood. The one narrow exception is tracked in project conventions.
filterwarnings = [
    "error",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    # Python 3.14 reports sockets/files finalized after async fixture teardown;
    # these are known xdist cleanup warnings, not application warnings.
    "ignore:unclosed (transport|.*socket).*:ResourceWarning",
    "ignore:Exception ignored while (calling deallocator|finalizing).*:pytest.PytestUnraisableExceptionWarning",
    # SQLAlchemy cannot compare this operator-class expression; the migration
    # parity test still checks the live index separately.
    "ignore:Expression #1 .* in index 'ix_institutions_name_prefix'.*:UserWarning",
]
# Explicit, not "auto". Auto mode collects every async def as a test, including
# ones that were never meant to be, and the failure is a silent skip rather than
# an error. Both keys are required on pytest-asyncio 1.x â€” omitting the loop
# scope emits a deprecation warning on every run.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: deselect with '-m \"not slow\"'",
    "db: needs a live PostgreSQL; set TEST_DATABASE_URL or these skip",
]

[tool.coverage.run]
source = ["src/app"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]

[tool.check-layers]
# Defaults are correct for this layout; stated explicitly so the boundary is
# visible in the repo rather than implied. Do not widen to make a check pass.
source = "src/app"
package = "app"
# The composition roots: main.py and the api/deps/ package, file by file —
# the same sanctioned wiring point deps.py was, split by area (owner, 2026-09-29).
# A new module in api/deps/ is listed here deliberately, never by a glob.
exempt = [
    "main.py",
    "api/deps/__init__.py",
    "api/deps/account.py",
    "api/deps/admin.py",
    "api/deps/admin_credits.py",
    "api/deps/admin_mentors.py",
    "api/deps/availability.py",
    "api/deps/bio_draft.py",
    "api/deps/calendar.py",
    "api/deps/core.py",
    "api/deps/intake.py",
    "api/deps/interest.py",
    "api/deps/jobs.py",
    "api/deps/links.py",
    "api/deps/matches.py",
    "api/deps/mentors.py",
    "api/deps/messages.py",
    "api/deps/offerings.py",
    "api/deps/profile.py",
    "api/deps/reviews.py",
    "api/deps/session_types.py",
    "api/deps/sessions.py",
    "api/deps/writing_assist.py",
]

[tool.check-layers.allowed]
api = ["domain", "core"]
domain = ["core"]
infra = ["domain", "core"]
core = []

[tool.check-layers.forbidden-external]
# Frameworks, drivers and vendor SDKs that must never reach the pure layer.
domain = [
    "fastapi",
    # Token verification is a transport concern and a vendor-shaped one; the
    # verifier lives in infra/auth and is wired in api/deps/.
    "jwt",
    "starlette",
    "sqlalchemy",
    "alembic",
    "httpx",
    "requests",
    "redis",
    "boto3",
    "celery",
    "pymongo",
    # Vendor SDKs â€” see the shared list note under [tool.check-layers] api below.
    "composio",
    "composio_core",
    "supabase",
    "gotrue",
    "postgrest",
    "storage3",
    "realtime",
    "supafunc",
    "posthog",
    "qstash",
    "upstash_qstash",
    # OpenCV, for face detection. Its one home is `infra/images/faces.py` (#180);
    # the focal-point rule in `domain/avatar_focus.py` is pure and takes boxes.
    "cv2",
    # Error reporting is started in `infra/observability.py` only (ADR 0030). See
    # the note under `core` below for what this entry does and does not protect.
    "sentry_sdk",
]

# `api/` is transport. It may import the web framework, and nothing that speaks to
# a third party â€” that belongs in `infra/`, behind a Protocol in `domain/ports.py`.
#
# THIS IS A DENYLIST, AND THAT IS ITS LIMIT. It catches the vendors we have
# actually adopted, by name. It cannot catch an SDK nobody has added to it, so a
# newly adopted vendor is unguarded until its package name is listed here. Add the
# name in the same change that adds the dependency. ADR 0004/0005/0006 state this
# boundary; this list is the only thing that makes any of it mechanical.
api = [
    # Pillow. Deliberately absent from `domain` above â€” `domain/images.py` is
    # where decoding belongs, and it is a pure library rather than a vendor or a
    # framework. Denied here so image handling cannot drift out of the one module
    # that caps pixels and re-encodes to strip EXIF: a route decoding bytes itself
    # would bypass both, and no other gate reads imports.
    "PIL",
    # OpenCV: face detection lives behind `infra/images/faces.py` (#180).
    "cv2",
    "composio",
    "composio_core",
    "supabase",
    "gotrue",
    "postgrest",
    "storage3",
    "realtime",
    "supafunc",
    "posthog",
    "qstash",
    "upstash_qstash",
    "boto3",
    "celery",
    "sqlalchemy",
    "alembic",
    "sentry_sdk",
]

# `core/` is configuration and the base error taxonomy. Listed so that "no vendor
# SDK outside infra/" is true of every layer rather than of two of the three.
#
# ON `sentry_sdk` SPECIFICALLY. The entry stops `domain/`, `api/` and `core/`
# importing it. It is started in exactly one place, `infra/observability.py`
# (ADR 0030), called from `main.py`, and only when `SENTRY_DSN` is set — with
# no request bodies, headers or frame locals, and every event scrubbed.
core = [
    # Pillow. Deliberately absent from `domain` above â€” `domain/images.py` is
    # where decoding belongs, and it is a pure library rather than a vendor or a
    # framework. Denied here so image handling cannot drift out of the one module
    # that caps pixels and re-encodes to strip EXIF: a route decoding bytes itself
    # would bypass both, and no other gate reads imports.
    "PIL",
    # OpenCV: face detection lives behind `infra/images/faces.py` (#180).
    "cv2",
    "composio",
    "composio_core",
    "supabase",
    "gotrue",
    "postgrest",
    "storage3",
    "realtime",
    "supafunc",
    "posthog",
    "qstash",
    "upstash_qstash",
    "boto3",
    "celery",
    "sqlalchemy",
    "alembic",
    "fastapi",
    "starlette",
    "sentry_sdk",
]
