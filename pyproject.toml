[project]
name = "edufurtherbe"
version = "0.1.0"
description = "Backend API for EduFurther — mentorship platform connecting African students with graduate school mentors."
readme = "README.md"
# One version, tested, claimed. A wider floor than CI actually exercises is an
# unverified compatibility promise; this is a deployed application, not a library
# consumed on many interpreters, so there is nothing to gain by making one.
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    # Persistence. The `asyncio` extra pulls greenlet, which SQLAlchemy's async
    # layer requires rather than merely benefits from.
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    # 0.31 is the first release with a cp314 wheel. A lower floor resolves and
    # then tries to build from source on a machine with no C compiler, which is
    # every Windows dev box here.
    "asyncpg>=0.31",
    # The IANA time-zone database, as a package rather than a system dependency.
    #
    # `zoneinfo` has no bundled data: it reads the operating system's database,
    # and Windows has none. `available_timezones()` returns **zero** on a Windows
    # dev machine without this, so every `ZoneInfo("Africa/Lagos")` raises — while
    # CI on ubuntu passes, because Linux ships the database. A slim container
    # image usually does not.
    #
    # That matters here beyond convenience: `users.timezone` stores IANA names, a
    # guardrail requires the mentor's zone as its own column, and M3 availability
    # is entirely time-zone conversion. Pinning the data as a dependency makes the
    # three environments agree instead of differing by platform.
    "tzdata>=2025.1",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.0",
    # Decoding, downscaling and re-encoding uploaded images. **The only
    # dependency here that parses untrusted binary**, which is the whole risk of
    # the upload endpoint: an image decoder is a C surface reached by whatever
    # bytes a caller sends. `domain/images.py` caps the decoded pixel count
    # before any bitmap is allocated, because Pillow's own default *warns* and
    # continues.
    #
    # Re-encoding is also what strips EXIF — the GPS coordinates a phone puts in
    # a photo — which ADR 0019 left open and which had to be settled before
    # profiles became public.
    # The floor is the version this was verified against, not the oldest that
    # might work. The migration decodes AVIF, which needs a build carrying the
    # codec — `features.check_module("avif")` was confirmed true here — and a
    # floor guessed from a changelog is a claim nobody checked.
    "pillow>=12.3",
]

[dependency-groups]
dev = [
    # Pinned exactly, and kept equal to the `rev:` values in
    # .pre-commit-config.yaml. These three decide whether code passes, and their
    # verdicts change between versions — a floor range lets the venv drift away
    # from the hooks, so pre-commit and CI start disagreeing about identical
    # code. After `pre-commit autoupdate`, update these to match.
    "ruff==0.16.1",
    "mypy==2.3.0",
    "bandit[toml]==1.9.4",

    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-randomly>=3.16.0",
    # 1.x, not 0.x: the configuration keys below are the 1.0 spelling, and 0.x
    # silently ignores them.
    #
    # No testcontainers. It pulls the Docker SDK and its requests/urllib3 chain
    # into `uv export`, which feeds `pip-audit --strict` on a weekly schedule —
    # a standing CVE surface for a package whose only job is starting a
    # container. A DATABASE URL from docker-compose locally and a `services:`
    # block in CI give the same real-Postgres guarantee with no dependency.
    "pytest-asyncio>=1.0",
    # Generator-only, and deliberately not a runtime dependency. Reference rows
    # are baked into a migration by scripts/generate_reference_seeds.py, so the
    # application never needs this at import or request time — shipping it would
    # be dead weight in the image and another entry in the weekly pip-audit.
    "pycountry>=24.6.1",
    "httpx>=0.27.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# The deployed entrypoint, stated rather than discovered.
#
# `fastapi run` otherwise looks for six fixed paths relative to the working
# directory — main.py, app.py, api.py, app/main.py, app/app.py, app/api.py — and
# `src/app/main.py` is none of them. This key is read by
# `fastapi_cli.config.FastAPIConfig` from `[tool.fastapi]` in the pyproject.toml
# **of the current directory**, so the run has to start at the repository root.
# That is the default; leave FastAPI Cloud's Application Directory unset.
#
# `app.main:app`, not `src.app.main:app`: `src` is not a package and has no
# `__init__.py`. The wheel installs `src/app` as the top-level `app`, which is
# the same import string the README and Makefile already use.
[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
# 100, not the default 88, so scripts/check_layers.py stays byte-identical to the
# shared package copy. It is documented as drop-in reusable; reformatting it here
# would create a diff against every future update.
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# Matches the `exclude: ^\.claude/` on the ruff hooks in .pre-commit-config.yaml.
# Without it, CI's bare `ruff check .` would lint files pre-commit skips, and the
# local gate would disagree with the remote one.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "N",    # naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtin shadowing
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "S",    # bandit overlap — catches issues before commit
    "ARG",  # unused arguments
    "PTH",  # pathlib over os.path
    "TID",  # tidy imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so `from scripts import ...` resolves.
#
# It resolved before only as a side effect: `alembic.ini` sets
# `prepend_sys_path = .`, so any test that ran a migration first left the root on
# sys.path for whatever came after. Tests importing `scripts` therefore passed in
# a full run and failed in isolation — order dependence that `-p no:randomly`
# hides and a single-test invocation exposes. `scripts/` stays a non-package on
# purpose; this makes the path explicit instead of inherited.
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
# Explicit, not "auto". Auto mode collects every async def as a test, including
# ones that were never meant to be, and the failure is a silent skip rather than
# an error. Both keys are required on pytest-asyncio 1.x — omitting the loop
# scope emits a deprecation warning on every run.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: deselect with '-m \"not slow\"'",
    "db: needs a live PostgreSQL; set TEST_DATABASE_URL or these skip",
]

[tool.coverage.run]
source = ["src/app"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]

[tool.check-layers]
# Defaults are correct for this layout; stated explicitly so the boundary is
# visible in the repo rather than implied. Do not widen to make a check pass.
source = "src/app"
package = "app"
exempt = ["main.py", "api/deps.py"]

[tool.check-layers.allowed]
api = ["domain", "core"]
domain = ["core"]
infra = ["domain", "core"]
core = []

[tool.check-layers.forbidden-external]
# Frameworks, drivers and vendor SDKs that must never reach the pure layer.
domain = [
    "fastapi",
    # Token verification is a transport concern and a vendor-shaped one; the
    # verifier lives in infra/auth and is wired in api/deps.py.
    "jwt",
    "starlette",
    "sqlalchemy",
    "alembic",
    "httpx",
    "requests",
    "redis",
    "boto3",
    "celery",
    "pymongo",
    # Vendor SDKs — see the shared list note under [tool.check-layers] api below.
    "composio",
    "composio_core",
    "supabase",
    "gotrue",
    "postgrest",
    "storage3",
    "realtime",
    "supafunc",
    "posthog",
    "qstash",
    "upstash_qstash",
    # Arrived as a transitive of `fastapi[standard]` -> fastapi-cloud-cli, not by a
    # decision to adopt error reporting. Listed so it cannot be imported by accident
    # simply because it happens to be installed. See the note under `core` below for
    # what this entry does and does not protect.
    "sentry_sdk",
]

# `api/` is transport. It may import the web framework, and nothing that speaks to
# a third party — that belongs in `infra/`, behind a Protocol in `domain/ports.py`.
#
# THIS IS A DENYLIST, AND THAT IS ITS LIMIT. It catches the vendors we have
# actually adopted, by name. It cannot catch an SDK nobody has added to it, so a
# newly adopted vendor is unguarded until its package name is listed here. Add the
# name in the same change that adds the dependency. ADR 0004/0005/0006 state this
# boundary; this list is the only thing that makes any of it mechanical.
api = [
    "composio",
    "composio_core",
    "supabase",
    "gotrue",
    "postgrest",
    "storage3",
    "realtime",
    "supafunc",
    "posthog",
    "qstash",
    "upstash_qstash",
    "boto3",
    "celery",
    "sqlalchemy",
    "alembic",
    "sentry_sdk",
]

# `core/` is configuration and the base error taxonomy. Listed so that "no vendor
# SDK outside infra/" is true of every layer rather than of two of the three.
#
# ON `sentry_sdk` SPECIFICALLY, AND THE LIMIT OF LISTING IT HERE. The entry stops
# `domain/`, `api/` and `core/` importing it — but NOT the composition roots. Both
# `exempt` paths are skipped, and `main.py` is skipped before exemption is even
# consulted because it sits outside any layer. `sentry_sdk.init(dsn=…)` in `main.py`
# is exactly how error reporting would be wired, and exactly what this list does not
# see. It also does nothing about the package shipping in the production image.
#
# What makes that safe is not this entry: `sentry_sdk` is inert without an `init()`
# call, nothing calls it, and no DSN is configured. Treat the entry as preventing an
# accidental import, not as a control. Initialising it deliberately is an ADR — an
# observability vendor plus stack traces carrying user emails and ids — not a
# one-line change to `main.py`.
core = [
    "composio",
    "composio_core",
    "supabase",
    "gotrue",
    "postgrest",
    "storage3",
    "realtime",
    "supafunc",
    "posthog",
    "qstash",
    "upstash_qstash",
    "boto3",
    "celery",
    "sqlalchemy",
    "alembic",
    "fastapi",
    "starlette",
    "sentry_sdk",
]
